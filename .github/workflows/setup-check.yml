name: Auto Setup Deployment

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  auto-setup:
    name: Auto Setup Deployment (First Time)
    runs-on: ubuntu-latest
    # Only run if secrets don't exist
    if: ${{ secrets.RENDER_DEPLOY_HOOK_DEV == '' || secrets.RENDER_DEPLOY_HOOK_PROD == '' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Check if API tokens are available
        id: check_tokens
        run: |
          if [ -n "${{ secrets.RENDER_API_KEY }}" ] && [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "tokens_available=true" >> $GITHUB_OUTPUT
            echo "✅ API tokens found - will run automatic setup"
          else
            echo "tokens_available=false" >> $GITHUB_OUTPUT
            echo "⚠️  API tokens not found - manual setup required"
          fi
      
      - name: Install Dependencies
        if: steps.check_tokens.outputs.tokens_available == 'true'
        run: |
          pip install PyNaCl python-dotenv requests
      
      - name: Run Automatic Setup
        if: steps.check_tokens.outputs.tokens_available == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_SETUP_TOKEN }}
        run: |
          echo "🚀 Running automatic deployment setup..."
          python scripts/auto-deploy-setup.py
      
      - name: Manual Setup Instructions
        if: steps.check_tokens.outputs.tokens_available == 'false'
        run: |
          echo "⚠️  Automatic setup cannot run - API tokens not configured"
          echo ""
          echo "📋 To enable automatic setup, add these secrets to GitHub:"
          echo ""
          echo "1. RENDER_API_KEY"
          echo "   Get from: https://dashboard.render.com/u/settings#api-keys"
          echo ""
          echo "2. GITHUB_SETUP_TOKEN"
          echo "   Get from: https://github.com/settings/tokens"
          echo "   Required scopes: repo, workflow"
          echo ""
          echo "After adding these secrets, push again and setup will run automatically!"
          echo ""
          echo "📚 Alternative: Manual Setup"
          echo "   See: GITHUB_SECRETS_SETUP.md or SETUP_OPTIONS.md"
          exit 1
